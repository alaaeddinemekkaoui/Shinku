[package]
name = "project-phoenix"
version = "0.1.0"
edition = "2021"
authors = ["Phoenix Team"]
description = "A modern, lightweight, native text editor written in Rust"
license = "MIT"

[dependencies]
# Core text buffer - rope data structure for efficient text manipulation
ropey = "1.6"

# UI framework - modern, native, declarative UI
slint = "1.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

[build-dependencies]
slint-build = "1.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1  # Faster debug builds
