[package]
name = "shinku"
version = "0.1.0"
edition = "2021"
authors = ["Alaa"]
description = "Shinku 神紅 - A modern, lightweight text editor built with Tauri"
license = "MIT"

[dependencies]
# Core text buffer - rope data structure for efficient text manipulation
ropey = "1.6"

# Tauri framework
tauri = { version = "1.7", features = ["dialog-open", "dialog-save", "fs-read-file", "fs-write-file"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1  # Faster debug builds
